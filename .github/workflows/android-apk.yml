name: Build Lumio Native Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumio-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build native Android media player
    runs-on: ubuntu-latest
    steps:
      - name: Check out Lumio
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build native Lumio APK
        working-directory: android-native
        run: gradle assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumio-Native-Android-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Lumio Android APK (Latest Build)
          body: |
            Lumio native Android prototype built with AndroidX Media3 (ExoPlayer).
            Download app-debug.apk and install it on your Android device.
            This is an early prototype; format support varies by device and codec.
          prerelease: true
          make_latest: false
          files: android-native/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
