name: Build Lumio Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumio-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Lumio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Prepare Lumio web assets
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Lumio Android APK (Latest Build)
          body: |
            Latest automatically built Lumio Android test APK.

            Download `app-debug.apk` and install it on your Android device. You may need to allow your browser or file manager to install apps from this source.

            This is an early prototype. Browser codec support varies by device; not all formats supported by VLC are supported yet.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
