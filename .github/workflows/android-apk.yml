name: Build Lumio Android APK

on:
  workflow_dispatch:
  push:
    branches: ["draft/android-player"]
    paths:
      - "android-native/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

# Each source edit triggers CI; keep only the newest branch build running.
concurrency:
  group: lumio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      # Keep the same debug signing identity across GitHub-hosted runners.
      # This lets later preview APKs update the installed preview instead of
      # failing Android's signature check after every workflow run.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lumio-android-debug-keystore-v1
      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon assembleDebug
      - name: Report APK size
        run: |
          ls -lh android-native/app/build/outputs/apk/debug/app-debug.apk
          du -b android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare direct APK download
        run: cp android-native/app/build/outputs/apk/debug/app-debug.apk Lumio-Android-Preview.apk
      - name: Publish direct APK download (no ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: Lumio Android Preview
          target_commitish: ${{ github.sha }}
          body: |
            Direct APK download for the Lumio Android preview.
            Download Lumio-Android-Preview.apk and install it on your Android device.
            This is an early development preview; it has not been comprehensively device-tested.
          prerelease: true
          make_latest: false
          files: Lumio-Android-Preview.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
